name: AVPE verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux asset-free build and verification
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.2'
      - name: Install host build tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential ccache clang clang-tidy cmake curl extra-cmake-modules git
          libasound2-dev libaio-dev libcurl4-openssl-dev libdbus-1-dev libdecor-0-dev
          libegl-dev libevdev-dev libfontconfig-dev libfreetype-dev libglib2.0-dev
          libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libinput-dev libopengl-dev
          libopus-dev libpcap-dev libpipewire-0.3-dev libpulse-dev libssl-dev libudev-dev
          libva-dev libvpl-dev libwayland-dev libx11-dev libx11-xcb-dev libx264-dev
          libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev libxcb-damage0-dev
          libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev
          libxcb-present-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev
          libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxext-dev
          libxkbcommon-x11-dev libxrandr-dev lld make nasm ninja-build patch pkg-config
          perl tar zlib1g-dev
      - name: Install locked Python runner
        run: python -m pip install --require-hashes --disable-pip-version-check -r tools/ci-requirements.txt
      - name: Build and verify through AVPE's canonical owner
        env:
          CC: clang
          CXX: clang++
        run: uv run --frozen python tools/ci.py

  macos-intel:
    name: Intel macOS asset-free build and verification
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.2'
      - name: Install host build tools
        run: brew install ccache llvm nasm ninja
      - name: Install locked Python runner
        run: python -m pip install --require-hashes --disable-pip-version-check -r tools/ci-requirements.txt
      - name: Build and verify through AVPE's canonical owner
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          PATH: /usr/local/opt/llvm/bin:${{ env.PATH }}
        run: uv run --frozen python tools/ci.py
