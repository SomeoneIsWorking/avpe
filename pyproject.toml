[project]
name = "avpe"
version = "0.0.1"
description = "Aliens Versus Predator: Extinction (PS2) -> PC via a RE-driven PCSX2 C++ mod"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avpe = "avpe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avpe"]
